# 开发环境配置
app:
  prefix: ''
  port: 4000

# 数据库配置
db:
  mysql:
    host: '127.0.0.1'
    port: 3306
    username: 'root'
    password: 'root'
    database: 'nest-admin-test'
    charset: 'utf8mb4'
    timezone: '+08:00'
    connectionLimit: 10
    logging: true

# redis 配置
redis:
